<h2 class="pagetitle" style="padding: 0;">Wi-Fi Settings</h2>

<div id="settingswrap">

  <div id="settingscontent">

    <section class="wifi-settings-section">

      <div class="title"><span>Wi-Fi</span></div>

      <div class="flex-row wifi-credential">

        <div class="fb pix wifi-scan-button" data-ssid-target="ssid0" title="Search Wi-Fi networks">
          <svg viewBox="0 0 24 24" class="stroke"><circle cx="10.5" cy="10.5" r="5.5" fill="none" stroke-width="2"/><path d="m15 15 5 5" fill="none" stroke-width="2"/></svg>
        </div>

        <div class="inputwrap"><span class="inputtitle">SSID</span><input type="text" id="ssid0" class="textinput" name="ssid" maxlength="29" autocomplete="off" /></div>

        <div class="inputwrap wifi-password-wrap"><span class="inputtitle">Password</span><input type="password" id="pass0" class="textinput" name="pass" maxlength="39" autocomplete="off" /></div>

        <div class="fb pix wifi-eye-button" data-pass-target="pass0" title="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>

      </div>

          <input type="number" id="wifiminrssi" data-command="wifiminrssi" value="-70" min="-95" max="-50" step="1" inputmode="numeric" />
        </div>

      </div>

      <div class="flex-row last">

        <input id="file-upload" type="file" accept=".txt, .csv" hidden />
